# Nota: add_header dentro de un "location" anula los definidos en "server"; por eso las cabeceras
# de seguridad están en security-headers.conf y se incluyen en cada location.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Límite de carga: lotes de hasta 20 fotos de celular (el backend limita cada foto a 15 MB)
    client_max_body_size 120m;

    # DNS interno de Docker: el nombre "backend" se resuelve en cada petición (con caché de 10 s).
    # Sin esto, Nginx fija la IP al arrancar y devuelve 502 si el contenedor del backend se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
