[project]
name = "papasana-backend"
version = "0.1.0"
description = "Backend de PapaSana AP-01: detección por síntomas del tizón tardío de la papa"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "unit_tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app/services", "app/api"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
