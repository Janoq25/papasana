# Configuración común a los cinco modelos. El presupuesto de búsqueda (tuning) es IDÉNTICO para todos
# (comparación justa, docs/fase0_plan.md §6.3). Las rutas son relativas a la carpeta ml/.
experiment: papasana-ap01
pretrained: true
train:
  epochs: 30
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.0
  patience: 6
  amp: true
  num_workers: 2
  seed: 2026
data:
  manifest: data/manifest.csv
  roots:
    plantvillage_papa: data/raw/plantvillage_papa
    plantdoc_papa: data/raw/plantdoc_papa
  train_datasets: [plantvillage_papa]
  external_datasets: [plantdoc_papa]
  n_splits: 5
  near_duplicate_distance: 4
tuning:
  n_trials: 30
  max_epochs: 15
  timeout_hours: 4
  fold: 0
  seed: 2026
